defaults:

  logdir: ./logdir/{timestamp}
  replica: 0
  replicas: 1
  task: offline_comp
  seed: 42
  script: train_offline
  # C-LAP's c-lap.yaml (third_party/c-lap/hydra, D4RL state observations):
  # batch 64 windows of 50 transitions, model first, then the agent on the
  # frozen model. Its 500 + 500 epochs of 1000 updates are capped at 300K +
  # 300K like the other methods. The data batch carries a margin for windows
  # that cross an episode boundary, which are dropped. Steps count updates.
  batch_size: 84
  batch_length: 51
  report_length: 51
  replay_context: 0
  random_agent: False
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl]
    filter: 'loss|env_eval/.*(success|return)$|perf/'
    timer: True
    wandb_project: ''
    wandb_entity: ''
    wandb_group: ''
    wandb_name: ''

  run:
    schedule: two_phase
    step_unit: updates
    wm_steps: 300000
    steps: 600000           # + 300000 policy updates
    clock: step
    log_every: 1000
    report_every: 0
    eval_every: 0
    env_eval_every: 10000   # policy updates between live-env rollouts; 0 disables
    env_eval_episodes: 10
    env_eval_horizon: 500
    env_eval_max_tasks: 0
    env_eval_slots: 1
    env_eval_workers: 0
    from_checkpoint: ''
    save_every: 900
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}

  jax:
    platform: cuda

  agent:
    cfg: c-lap
    window: 50
    # c-lap.yaml's default; the paper picks it per dataset from {0.5, 1, 2, 3}.
    latent_action_std_scaling: 3.0

  data:
    root: data/expert-panda-offline-comp-data
    allow_overlap: false
    sampling:
      mode: uniform_task
      schedule: mixed
      eval_schedule: mixed
      batches_per_task: 1000
      shuffle_tasks: false
    train: {tasks: [Panda_Box_None_PickPlace]}
    test: {tasks: [Panda_Box_GoalWall_PickPlace]}

# Recombination test shared with the other methods: Panda x PickPlace, train on
# 13 of 16 object x obstacle combos, hold out 3.
offline_comp:
  logger:
    outputs: [jsonl, wandb]
    wandb_project: offline-comp-baselines
    wandb_group: composuite
    wandb_name: C-LAP
  data:
    train:
      tasks:
        - Panda_Box_None_PickPlace
        - Panda_Box_GoalWall_PickPlace
        - Panda_Box_ObjectDoor_PickPlace
        - Panda_Box_ObjectWall_PickPlace
        - Panda_Dumbbell_None_PickPlace
        - Panda_Dumbbell_GoalWall_PickPlace
        - Panda_Dumbbell_ObjectWall_PickPlace
        - Panda_Plate_None_PickPlace
        - Panda_Plate_ObjectDoor_PickPlace
        - Panda_Plate_ObjectWall_PickPlace
        - Panda_Hollowbox_None_PickPlace
        - Panda_Hollowbox_GoalWall_PickPlace
        - Panda_Hollowbox_ObjectDoor_PickPlace
    test:
      tasks:
        - Panda_Dumbbell_ObjectDoor_PickPlace
        - Panda_Plate_GoalWall_PickPlace
        - Panda_Hollowbox_ObjectWall_PickPlace

debug:
  run: {wm_steps: 100, steps: 200, log_every: 100, env_eval_every: 100, env_eval_episodes: 1, env_eval_max_tasks: 1, env_eval_workers: -1}
