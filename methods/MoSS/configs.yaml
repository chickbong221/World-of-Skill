# DreamerV3 world model + MoSS (mixture-of-skills) extension.
#
# Two dynamics backbones live side-by-side under `agent.dyn`:
#   rssm — vanilla DreamerV3 recurrent state-space model
#   moss — MoSS variant (see methods/MoSS/moss.py)
# Flip between them with `--agent.dyn.typ {rssm|moss}` or the named
# `offline_comp_moss` preset below.
#
# NOTE ON THE `moss:` BLOCK. The fields below mirror `rssm:` plus one
# extra key that agent.py explicitly reads (`expert_heads`). If your
# MoSSRSSM.__init__ signature has extra kwargs (num_experts,
# gate_temperature, task_embed_dim, load_balance_scale, ...), add them
# here so `**config.dyn.moss` passes them through. Any kwarg present in
# the block but missing from __init__ will raise "unexpected keyword
# argument". Any kwarg __init__ requires but missing here will raise
# "missing positional argument". Keep them in sync.

defaults:

  logdir: ./logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 42
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''
    wandb_project: ''
    wandb_entity: ''
    wandb_group: ''
    wandb_name: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}
    offline: {obs_dim: 93, action_dim: 8}

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    clock: time
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    eval_freq: 50000
    eval_every: 50000
    eval_video_freq: 0
    eval_reconfiguration_frequency: 1
    report_batches: 1
    env_eval_slots: 1   # parallel envs per task during env eval (~0.7GB RAM each)
    env_eval_workers: 0 # env processes; 0 = half the cpus, -1 = step envs in-process
    env_eval_every: 0
    env_eval_episodes: 5
    env_eval_horizon: 500
    env_eval_max_tasks: 0
    step_unit: samples  # samples | updates: what the logged step counts
    schedule: joint     # joint | two_phase (world model, then policy; offline only)
    wm_steps: 0         # two_phase: updates of the world model phase
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    profiler: False   # JAX trace of updates 100-120 (~600MB in the logdir)
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm       # switch to `moss` via preset or --agent.dyn.typ moss
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
      # MoSS block. Fields mirror rssm plus MoSS-specific keys. Adjust
      # the MoSS-specific keys to match your moss.MoSSRSSM.__init__.
      moss:
        deter: 8192
        hidden: 1024
        stoch: 32
        classes: 64
        act: silu
        norm: rms
        unimix: 0.01
        outscale: 1.0
        winit: trunc_normal_in
        imglayers: 2
        obslayers: 1
        dynlayers: 1
        absolute: False
        blocks: 8
        free_nats: 1.0
        experts: 8          # M — number of expert branches
        topk: 2             # k — experts activated per step (>= 2)
        zdim: 128           # expert feature dim (L_div)
        router_noise: true  # noisy top-k gating; disabled in imagination
        expert_heads: false # DreamerV3: shared reward/cont heads
        dense_warmup: false # legacy v2 behaviour
        # Predictive responsibility (Sec. 4.4)
        num_envs: 16        # overridden from data (task_id classes) in agent
        ema: 0.99
        tau_resp: 0.25      # acts on a skill score (~1 = persistence), not nats
        nmin: 256
        # Residual (PIT) invariance
        maxsig: 32
        nsig: 8
        warm_steps: 5000
        ramp_steps: 5000
        bal_impl: paper
        # Offline uncertainty penalty on imagined rewards (Eq. 28)
        beta_unc: 1.0
        unc_quantile: 95.0
    # Loss scales for the MoSS-specific heads. Only used when dyn.typ == 'moss'.
    # `mrew` and `mcon` are dropped automatically when expert_heads is false.
    moss_scales:
      mrew: 1.0
      mcon: 1.0
      mdiv: 1.0     # was 1000 to offset a 1/|B|^2 scale bug, now fixed
      msub: 1.0
      mbal: 0.003
      msp: 1.0
      mexp: 0.1
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False
    offline: {enabled: False, bc_scale: 0, imag_policy_scale: 1.0}
    # Policy phase of two_phase: dreamer (stochastic actor, REINFORCE, V critic)
    # or leq (embodied/jax/leq.py; LEQ, Park & Lee, ICLR 2025). anneal -1 = the
    # actor lr decays to 0 over the policy updates (steps - wm_steps).
    ac: dreamer
    leq: {expectile: 0.1, lam: 0.95, ratio: 0.25, actor_lr: 3e-5, critic_lr: 1e-4, anneal: -1, target_rate: 0.005, critic: {layers: 3, units: 1024, act: silu, norm: rms, output: mse, outscale: 0.0, winit: trunc_normal_in}}

  data:
    root: ''
    allow_overlap: false
    sampling:
      mode: uniform_task
      schedule: mixed
      eval_schedule: mixed
      batches_per_task: 1000
      shuffle_tasks: false
    train: {tasks: [Panda_Box_None_PickPlace]}
    test: {tasks: [Panda_Box_None_PickPlace]}

# Size presets update BOTH backbones so you can flip typ without resizing.
# Every pattern must match at least one existing key in the config, so the
# `moss:` block above must contain deter/hidden/classes for the .*\.moss
# pattern to succeed.

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.moss: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.moss: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.moss: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.moss: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.moss: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.moss: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.moss: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2

# Offline CompoSuite recombination test with vanilla RSSM.
# Train on 13 of 16 obj × obstacle combos (Panda × PickPlace fixed),
# hold out 3. Every object and every obstacle still appears in >=3 train
# tasks, so test failures isolate "unseen combinations of seen components".
offline_comp:
  <<: *size25m
  task: offline_comp
  script: train_offline
  # LEQ (Park & Lee, ICLR 2025), the recipe of its pixel experiments with this
  # world model in place of the DreamerV3 ensemble: imagination horizon 5,
  # then the LEQ actor-critic on the frozen model, no uncertainty penalty.
  # World model 3e5 updates, then the policy 3e5 updates, batch 64 x length 50
  # (Offline DV2) = 3200 transitions per update. The logged step counts updates.
  # `offline_dv2` is the previous default, `offline_comp_joint` the joint one.
  batch_size: 64
  batch_length: 50
  replay_context: 0
  run:
    schedule: two_phase
    step_unit: updates
    clock: step
    wm_steps: 300000
    steps: 600000           # + 300000 policy updates
    log_every: 1000
    report_every: 10000     # train-split report (v-d4rl eval_every 1e4)
    eval_every: 10000       # test-split report
    env_eval_every: 10000   # policy updates between env rollouts; 0 disables
    env_eval_episodes: 10   # episodes per task per env-eval
    env_eval_horizon: 500  # max env steps per episode
    env_eval_max_tasks: 0  # cap tasks evaluated per split; 0 = all
    from_checkpoint: ''
  logger:
    outputs: [jsonl, wandb]
    wandb_project: offline-comp-moss
    wandb_group: composuite
    wandb_name: dreamer-offline-comp
  jax:
    prealloc: false
  agent:
    ac: leq
    imag_length: 5
    dyn: {moss: {beta_unc: 0.0}}
    offline:
      enabled: true
      bc_scale: 0
      imag_policy_scale: 1.0
  data:
    root: data/expert-panda-offline-comp-data
    allow_overlap: false
    sampling:
      mode: uniform_task
      schedule: mixed
      eval_schedule: mixed
      batches_per_task: 1000
      shuffle_tasks: false
    train:
      tasks:
        - Panda_Box_None_PickPlace
        - Panda_Box_GoalWall_PickPlace
        - Panda_Box_ObjectDoor_PickPlace
        - Panda_Box_ObjectWall_PickPlace
        - Panda_Dumbbell_None_PickPlace
        - Panda_Dumbbell_GoalWall_PickPlace
        - Panda_Dumbbell_ObjectWall_PickPlace
        - Panda_Plate_None_PickPlace
        - Panda_Plate_ObjectDoor_PickPlace
        - Panda_Plate_ObjectWall_PickPlace
        - Panda_Hollowbox_None_PickPlace
        - Panda_Hollowbox_GoalWall_PickPlace
        - Panda_Hollowbox_ObjectDoor_PickPlace
    test:
      tasks:
        - Panda_Dumbbell_ObjectDoor_PickPlace
        - Panda_Plate_GoalWall_PickPlace
        - Panda_Hollowbox_ObjectWall_PickPlace

# MoSS variant of the offline recombination test, stacked as
# `--configs offline_comp offline_comp_moss`: dyn.typ moss with the world model
# at the size12m widths (24M, near the 28M of the DreamerV3 size25m baseline
# with 7 prior heads). The actor and the LEQ critic keep the size25m width of
# offline_comp, so only the world model differs.
offline_comp_moss:
  agent:
    dyn:
      typ: moss
      moss: {deter: 2048, hidden: 256, classes: 16}
    enc: {simple: {depth: 16, units: 256}}
    dec: {simple: {depth: 16, units: 256}}
    rewhead: {units: 256}
    conhead: {units: 256}
  logger:
    outputs: [jsonl, wandb]
    wandb_project: offline-comp-moss
    wandb_group: composuite-moss
    wandb_name: moss-offline-comp


# The previous default, v-d4rl Offline DV2 (offlinedv2/train_offline.py,
# `dmc_vision`): world model 25100 updates, then the Dreamer actor-critic for
# 2e5 updates on the frozen model. Stack after offline_comp (and offline_comp_moss).
offline_dv2:
  run: {wm_steps: 25100, steps: 225100}
  agent: {ac: dreamer, imag_length: 15, dyn: {moss: {beta_unc: 1.0}}}

# The earlier protocol: joint world model + policy updates of 32 x 64, counted
# in transitions, 3e5 updates (6.144e8 transitions; was 1e9). Stack after
# offline_comp (and offline_comp_moss).
offline_comp_joint:
  batch_size: 32
  batch_length: 64
  agent: {ac: dreamer, imag_length: 15, dyn: {moss: {beta_unc: 1.0}}}
  run:
    schedule: joint
    step_unit: samples
    wm_steps: 0
    steps: 6.144e8
    log_every: 100000
    report_every: 1000000
    eval_every: 2000000
    env_eval_every: 2000000
